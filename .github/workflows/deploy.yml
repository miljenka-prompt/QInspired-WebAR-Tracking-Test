name: Deploy WebAR Tracking Test to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install JS dependencies
        run: npm install

      - name: Install alpha-mask dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "rembg[cpu]" opencv-python-headless pillow

      - name: Prepare theropod RGB video
        run: |
          mkdir -p public
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/miljenka-prompt/AR-kredna-obala-Istarskog-arhipelaga/main/Cretaceous_teropod.mp4 \
            -o public/theropod.mp4

      - name: Generate theropod alpha mask
        run: python scripts/generate_alpha_mask.py public/theropod.mp4 public/theropod-mask.mp4

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
